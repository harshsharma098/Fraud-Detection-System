model:
  isolation_forest:
    contamination: 0.02
    n_estimators: 100
    max_samples: 256
    random_state: 42
  
  one_class_svm:
    nu: 0.02
    kernel: 'rbf'
    gamma: 'scale'
  
  autoencoder:
    encoding_dim: 32
    epochs: 50
    batch_size: 256
    validation_split: 0.2
    learning_rate: 0.001

data:
  dataset_path: "data/transactions.csv"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_state: 42

api:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  model_path: "models/best_model.joblib"
  model_type: "isolation_forest"  # Options: isolation_forest, one_class_svm, autoencoder

features:
  numerical: ["amount", "merchant_lat", "merchant_long", "distance_from_home", "hour", "day_of_week", "month"]
  categorical: ["merchant_category"]
  target: "is_fraud"

logging:
  log_file: "logs/api.log"
  max_bytes: 10485760
  backup_count: 5

